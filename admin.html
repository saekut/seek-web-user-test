<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin — SEEk Web User Test</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="results admin">

  <!-- Login -->
  <section id="a-login" class="card-view" hidden>
    <div class="card">
      <p class="eyebrow">Admin</p>
      <h1>SEEk Web User Test</h1>
      <form id="login-form">
        <label class="field"><span>Email</span><input type="email" name="email" required autocomplete="username" /></label>
        <label class="field"><span>Password</span><input type="password" name="password" required autocomplete="current-password" /></label>
        <p class="warn-text" id="login-error" hidden></p>
        <button class="btn primary wide" type="submit">Log in</button>
      </form>
      <p class="small center" style="margin-top:14px"><a href="#" id="forgot-link">Forgot password?</a></p>
      <p class="muted small center" id="demo-hint" hidden>Demo mode (no database connected yet): use any email and the password <b>admin</b>.</p>
    </div>
  </section>

  <!-- Set new password (after reset email) -->
  <section id="a-newpass" class="card-view" hidden>
    <div class="card">
      <p class="eyebrow">Admin</p>
      <h2>Set a new password</h2>
      <form id="newpass-form">
        <label class="field"><span>New password</span><input type="password" name="password" required minlength="8" autocomplete="new-password" /></label>
        <p class="warn-text" id="newpass-msg" hidden></p>
        <button class="btn primary wide" type="submit">Save password</button>
      </form>
    </div>
  </section>

  <!-- Not an admin -->
  <section id="a-denied" class="card-view" hidden>
    <div class="card center">
      <h2>No admin access</h2>
      <p class="muted">You're logged in, but this account isn't an admin.</p>
      <button class="btn ghost wide" id="denied-logout">Log out</button>
    </div>
  </section>

  <!-- App -->
  <div id="a-app" hidden>
    <header class="a-top">
      <a href="#tests" class="a-brand">SEEk Web User Test <span>Admin</span></a>
      <span class="pill prog" id="mode-badge" hidden>Demo mode</span>
      <div class="a-top-right">
        <span class="muted small" id="who"></span>
        <button class="btn ghost small-btn dark" id="logout">Log out</button>
      </div>
    </header>
    <main class="r-wrap" id="a-main"></main>
  </div>

  <div id="a-toast" class="a-toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/demo-study.js"></script>
  <script src="js/db.js"></script>
  <script src="js/results.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
